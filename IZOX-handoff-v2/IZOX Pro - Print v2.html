<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #D1D5DB; font-family: "Inter", system-ui, sans-serif; color: #111827; }
  button, input, select { font-family: inherit; }

  /* Chaque page = 1440×900 avec gouttière écran */
  .page {
    width: 1440px;
    min-height: 900px;
    height: 900px;
    overflow: hidden;
    position: relative;
    background: #F9FAFB;
    margin: 0 auto 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,.18);
  }

  /* Label artboard écran seulement */
  .page-label {
    position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 9999;
    background: rgba(17,24,39,.8); color: #fff;
    font-family: "Inter",system-ui,sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    display: flex; align-items: center; padding: 0 14px;
    pointer-events: none;
  }

  /* Section divider page */
  .section-page {
    width: 1440px; height: 900px;
    background: #1B4332;
    margin: 0 auto 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 32px rgba(0,0,0,.2);
  }

  /* Contenu mis à l'échelle dans la page */
  .scale-wrap {
    position: absolute;
    transform-origin: top left;
  }

  @media print {
    @page { size: 1440px 900px; margin: 0; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body { background: white !important; }
    .page-label { display: none !important; }
    .page, .section-page { margin: 0 !important; box-shadow: none !important; break-after: page; page-break-after: always; }
  }
</style>

<script type="text/babel">
// ── Helpers ──────────────────────────────────────────────────────────────────

const PW = 1440, PH = 900;

// Monte un composant React dans une div mis à l'échelle à l'intérieur d'une .page
const ScaledPage = ({ label, srcW = 1440, srcH = 900, children }) => {
  const scale = Math.min(PW / srcW, PH / srcH);
  const ox = (PW - srcW * scale) / 2;
  const oy = (PH - srcH * scale) / 2;
  return (
    <div className="page">
      <div className="page-label">{label}</div>
      <div className="scale-wrap" style={{
        width: srcW, height: srcH,
        transform: `translate(${ox}px,${oy}px) scale(${scale})`,
      }}>
        {children}
      </div>
    </div>
  );
};

// Page de séparation de section — une seule par section
const SectionDiv = ({ num, title, subtitle, artboards }) => (
  <div className="section-page">
    {/* Grille déco */}
    <div style={{ position:"absolute", inset:0, opacity:.04, backgroundImage:"repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 60px),repeating-linear-gradient(90deg,#fff 0,#fff 1px,transparent 1px,transparent 60px)" }}/>
    {/* Numéro section grand fond */}
    <div style={{ position:"absolute", right:60, top:"50%", transform:"translateY(-50%)", fontFamily:"Outfit,sans-serif", fontSize:260, fontWeight:700, color:"rgba(255,255,255,.04)", lineHeight:1, userSelect:"none" }}>{num}</div>
    {/* Contenu */}
    <div style={{ position:"relative", textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center", gap:18, maxWidth:780, padding:"0 40px" }}>
      <div style={{ fontFamily:"Inter,sans-serif", fontSize:11, fontWeight:700, letterSpacing:".2em", color:"rgba(255,255,255,.45)", textTransform:"uppercase" }}>Section {num}</div>
      <div style={{ fontFamily:"Outfit,sans-serif", fontSize:58, fontWeight:700, letterSpacing:"-1.5px", color:"#fff", lineHeight:1.05 }}>{title}</div>
      <div style={{ fontFamily:"Inter,sans-serif", fontSize:16, color:"rgba(255,255,255,.55)", lineHeight:1.7, maxWidth:600 }}>{subtitle}</div>
      <div style={{ display:"flex", gap:10, marginTop:6, flexWrap:"wrap", justifyContent:"center" }}>
        {artboards.map(a => (
          <div key={a} style={{ background:"rgba(255,255,255,.1)", border:"1px solid rgba(255,255,255,.18)", padding:"5px 16px", borderRadius:999, fontFamily:"Inter,sans-serif", fontSize:11, color:"rgba(255,255,255,.7)", fontWeight:600 }}>{a}</div>
        ))}
      </div>
    </div>
    {/* Barre verte bas */}
    <div style={{ position:"absolute", bottom:0, left:0, right:0, height:5, background:"#7CC9A5" }}/>
  </div>
);

// Page de couverture

      <div style={{ display:"flex", gap:10, marginTop:6 }}>

}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PrintApp/>);

// Auto-print après chargement complet fonts + React
document.fonts.ready.then(() => {
  setTimeout(() => window.print(), 3500);

</script>
