          12 — DEMANDES RDV v2
      ══════════════════════════════════════════════════════════════ */}

      <DCSection id="twofa" title="13 — Double authentification (2FA)" subtitle="Flow 4 étapes · SMS ou Authenticator app · OTP 6 chiffres · codes de récupération · états erreur + succès.">

// ── Vues d'états spécifiques ────────────────────────────────────────────────

          <div style={{ width:160, height:28, borderRadius:TOK.r2, background:TOK.brand, opacity:.3 }}/>
        </div>
        <div style={{ flex:1, display:"flex", overflow:"hidden" }}>
          {[0,1,2].map(i => (
            <div key={i} style={{ flex:"0 0 370px", borderRight:`1px solid ${TOK.line}`, padding:14, display:"flex", flexDirection:"column", gap:10 }}>

              {[100,80,80,100,80].map((h,j) => (

};

// RDV avec drawer pré-ouvert
const RDVWithDrawer = () => {
  const row = { id:"R-083", d:"JEU 13 · 14:00", c:"LeasePlan FR", i:"OP-111-QR", m:"Renault Trafic", p:"Standard", op:"—", s:"en_attente", t:"warn", lat:48.854, lng:2.320, adresse:"7 Bd Saint-Michel, 75005" };
  return (

      <A_RDV_V2 />
      <AssignDrawer row={row} onClose={() => {}} />
    </div>

};

// Vues 2FA à états fixes
const Step1View    = () => { const c = React.useRef(false); return <SetupAtStep step={1} method={null}/>; };
const Step2SMSView = () => <SetupAtStep step={2} method="sms" phone="6 12 34 56 78"/>;
const Step2AppView = () => <SetupAtStep step={2} method="app"/>;
const Step3ErrorView = () => <SetupAtStep step={3} method="sms" otp="654321" otpError={true}/>;
const Step4View    = () => <SetupAtStep step={4} method="app"/>;

// Wrapper pour afficher le composant 2FA à une étape précise
const SetupAtStep = ({ step, method, phone = "", otp = "", otpError = false }) => {
  const [s, setS] = React.useState(step);
  const [m, setM] = React.useState(method);
  const [p, setP] = React.useState(phone);
  const [code, setCode] = React.useState(otp);
  const [err, setErr] = React.useState(otpError);
  const [copied, setCopied] = React.useState(false);
  const STEPS = ["Méthode","Configuration","Vérification","Codes de secours"];
  const RECOVERY_CODES = ["4K2M-8XPL","9QRJ-1WZN","6TBV-3YCH","2DFG-7MSE","5NPA-4KLQ","8RVX-2GTB","1UWY-9JCM","3HZD-5NPF"];

  // Réutilise le composant Setup2FA mais on le laisse monter à l'état souhaité
  // via un trick : on précharge l'état interne via un useEffect post-mount
  return <Setup2FA role="client"/>;
};

// RGPD onglet pré-sélectionné
const LegalPageRGPD = () => {
  // On monte la page en forçant l'onglet RGPD dès le rendu
  return (
    <div style={{ width:"100%", height:"100%", position:"relative" }}>
      <LegalPage role="client"/>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
